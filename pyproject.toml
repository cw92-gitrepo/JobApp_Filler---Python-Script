# Tool settings only. Dependencies are in requirements.txt / requirements-dev.txt,
# because this is a script you run, not a package you install.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["*.md"]  # README code snippets are examples, not code to format

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, modern-syntax upgrades, common bug patterns
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
